[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinystats"
version = "0.1.0"
description = "A tiny example library for mean and median, used for learning packaging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Education",
]

# Runtime dependency for the CLI (used in src/tinystats/cli.py)
dependencies = [
  "click>=8.1,<9",
]

[project.optional-dependencies]
# Dev/test tools specified as ranges so consumers aren't over-pinned
dev = [
  "pytest>=7,<8",
  "pytest-cov>=4,<5",
  "build>=1,<2",
]

[project.urls]
Homepage = "https://example.com/tinystats"
Repository = "https://example.com/tinystats-repo"
Issues = "https://example.com/tinystats/issues"

[project.scripts]
# Exposes a console script `tinystats ...`
tinystats = "tinystats.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinystats*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=tinystats --cov-report=term-missing:skip-covered --no-cov-on-fail"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tinystats"]

[tool.coverage.report]
show_missing = true
fail_under = 95
